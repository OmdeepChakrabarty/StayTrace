name: StayTrace CI & Scheduled Crawler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  test-and-crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v

      - name: Run active parcel crawler
        env:
          DATABASE_BACKEND: ${{ secrets.DATABASE_BACKEND || 'turso' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE || 'cli_unlocker' }}
          BRIGHTDATA_ENDPOINT: ${{ secrets.BRIGHTDATA_ENDPOINT || 'https://api.brightdata.com' }}
          DATABASE_PATH: parcels.db
          LOG_LEVEL: INFO
        run: |
          python -m scraper.crawl
