<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corrupted / Ambiguous Feed</title>
</head>
<body>
  <div class="unknown-wrapper">
    <div>Container: INVALID_CONTAINER_123</div>
    <div>Status: Unknown Error</div>

    <!-- Contradictory destination ports in identical unlabeled blocks -->
    <div class="port-block">
      <span class="label">Port of Discharge:</span>
      <span class="val">Singapore (SGSIN)</span>
    </div>
    <div class="port-block">
      <span class="label">Port of Discharge:</span>
      <span class="val">Rotterdam (NLRTM)</span>
    </div>

    <div>ETA: Invalid Timestamp Format</div>
  </div>
</body>
</html>
